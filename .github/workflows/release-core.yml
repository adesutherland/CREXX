name: Release core qualification
on:
  push:
    branches: [temp/llama-release-core]
  workflow_dispatch:
    inputs:
      platform:
        description: Core configuration to qualify (all for the release gate)
        type: choice
        default: all
        options: [all, linux-x64, windows-x64, macos-arm64, macos-x86_64, windows-mingw]
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-core-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  configurations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'all' }}
        shell: python
        run: |
          import json, os
          configurations = [
              dict(platform="linux-x64", os="ubuntu-24.04", toolchain="gcc",
                   vm="rxtvm", cmake_args=""),
              dict(platform="windows-x64", os="windows-2025", toolchain="msvc",
                   vm="rxbvm", cmake_args="-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DENABLE_PARSER_MODE=OFF"),
              dict(platform="windows-mingw", os="windows-2025", toolchain="mingw",
                   vm="rxtvm", cmake_args="-DCREXX_FORCE_SYSTEM_OPENSSL=ON -DENABLE_PARSER_MODE=OFF"),
              dict(platform="macos-arm64", os="macos-15", toolchain="clang",
                   vm="rxbvm", cmake_args="-DCMAKE_OSX_ARCHITECTURES=arm64"),
              dict(platform="macos-x86_64", os="macos-15-intel", toolchain="clang",
                   vm="rxbvm", cmake_args="-DCMAKE_OSX_ARCHITECTURES=x86_64"),
          ]
          selected = os.environ["SELECTED_PLATFORM"]
          rows = [row for row in configurations if selected in ("all", row["platform"])]
          if not rows:
              raise SystemExit("Unknown core platform: " + selected)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": rows}) + "\n")
  core:
    needs: configurations
    name: Core ${{ matrix.platform }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configurations.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ inputs.commit || github.sha }}
      - uses: msys2/setup-msys2@v2
        if: matrix.toolchain == 'mingw'
        with:
          update: true
          install: base-devel git
          pacboy: toolchain:p cmake:p ninja:p openssl:p pkgconf:p python:p
      - uses: actions/setup-python@v6
        if: matrix.toolchain != 'mingw'
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.toolchain == 'msvc'
        with:
          arch: x64
          toolset: '14.44'
      - name: Configure core without inference dependencies
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/core-build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LLAMA=OFF \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DCREXX_QA_CTEST_JOBS=5 \
            -DCREXX_BUILD_CHANNEL=local \
            -DCREXX_BUILD_COMMIT="${{ inputs.commit || github.sha }}" \
            ${{ matrix.cmake_args }}
      - name: Configure core without inference dependencies (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/core-build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LLAMA=OFF \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DCREXX_QA_CTEST_JOBS=5 \
            -DCREXX_BUILD_CHANNEL=local \
            -DCREXX_BUILD_COMMIT="${{ inputs.commit || github.sha }}" \
            ${{ matrix.cmake_args }}
      - name: Build core product
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: cmake --build "${{ runner.temp }}/core-build" --target stage-product stage-optional --parallel 2
      - name: Build core product (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --build "${{ runner.temp }}/core-build" --target stage-product stage-optional --parallel 2
      - name: Check core correctness
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: cmake --build "${{ runner.temp }}/core-build" --target qa-smoke --parallel 2
      - name: Check core correctness (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: cmake --build "${{ runner.temp }}/core-build" --target qa-smoke --parallel 2
      - name: Check focused KeyAccess modes
        if: matrix.toolchain == 'msvc'
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/core-build" --target keyaccess_test keyaccess_compact_failure_test --parallel 2
          ctest --test-dir "${{ runner.temp }}/core-build" -R '^keyaccess_(test_(opt|noopt)|compact_failure)$' --parallel 1 --output-on-failure

      - name: Check focused KeyAccess modes (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake --build "${{ runner.temp }}/core-build" --target keyaccess_test keyaccess_compact_failure_test --parallel 2
          ctest --test-dir "${{ runner.temp }}/core-build" -R '^keyaccess_(test_(opt|noopt)|compact_failure)$' --parallel 1 --output-on-failure

      - name: Package and test the actual core ZIP
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          python scripts/package-core-release.py --source . \
            --build "${{ runner.temp }}/core-build" --output "${{ runner.temp }}/core-package" \
            --platform "${{ matrix.platform }}" --toolchain "${{ matrix.toolchain }}" \
            --preferred-vm "${{ matrix.vm }}" --commit "${{ inputs.commit || github.sha }}"
      - name: Package and test the actual core ZIP (MinGW)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          python scripts/package-core-release.py --source . \
            --build "${{ runner.temp }}/core-build" --output "${{ runner.temp }}/core-package" \
            --platform "${{ matrix.platform }}" --toolchain "${{ matrix.toolchain }}" \
            --preferred-vm "${{ matrix.vm }}" --commit "${{ inputs.commit || github.sha }}"
      - name: Retain core evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-qa-${{ matrix.platform }}-${{ inputs.commit || github.sha }}
          path: |
            ${{ runner.temp }}/core-package/qa
            ${{ runner.temp }}/core-build/Testing/Temporary
            ${{ runner.temp }}/core-build/CMakeCache.txt
            ${{ runner.temp }}/core-build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14
      - name: Retain qualified core for plugin jobs
        if: matrix.toolchain != 'mingw'
        uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.platform }}-${{ inputs.commit || github.sha }}
          path: ${{ runner.temp }}/core-package/assets/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed core archive for packaging diagnosis
        if: failure() && matrix.toolchain != 'mingw'
        uses: actions/upload-artifact@v7
        with:
          name: unqualified-core-${{ matrix.platform }}-${{ inputs.commit || github.sha }}
          path: ${{ runner.temp }}/core-package/assets/*.zip
          if-no-files-found: ignore
          retention-days: 7
