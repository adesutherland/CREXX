name: Build CREXX

on:
  push:
    branches:
      - develop
      - master
      # Auxiliary diagnostic branches are manual-only; a delayed push event
      # must not supersede a manually selected lane with the whole matrix.
      - 'temp/llama-release-qa'
  create:
  pull_request:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      lane:
        description: Candidate lane (publication always builds every package)
        type: choice
        default: all
        options: [all, base, cuda, linux, windows, macos-arm64, macos-intel, linux-cuda, windows-cuda]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/temp/llama-release-') }}

permissions:
  contents: read

jobs:
  version:
    name: Determine Version Metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      channel: ${{ steps.metadata.outputs.channel }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      commit: ${{ steps.metadata.outputs.commit }}
      display_version: ${{ steps.metadata.outputs.display_version }}
      release_name: ${{ steps.metadata.outputs.release_name }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      core_matrix: ${{ steps.matrix.outputs.core_matrix }}

    steps:
      - name: Checkout version file
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Determine metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version_file="$(tr -d '[:space:]' < VERSION)"
          version="$version_file"
          channel="local"
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          source_commit="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            source_commit="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          fi
          short_sha="${source_commit:0:12}"
          release_name="CREXX Local Build ${timestamp}"

          if [ "${GITHUB_EVENT_NAME}" = "create" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="release"
            release_name="CREXX ${version}"

            if [ "$version" != "$version_file" ]; then
              echo "Release tag ${GITHUB_REF_NAME} does not match VERSION file ${version_file}" >&2
              exit 1
            fi
          elif [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            channel="dev-snapshot"
            release_name="CREXX Dev Snapshot ${timestamp}"
          fi

          version_without_build="${version%%+*}"
          version_build_metadata=""
          if [[ "$version" == *+* ]]; then
            version_build_metadata="${version#*+}"
          fi

          if [ "$channel" = "release" ]; then
            display_version="crexx-${version}"
          elif [ -n "$version_build_metadata" ]; then
            display_version="crexx-${version_without_build}+${version_build_metadata}.${channel}.g${short_sha}"
          else
            display_version="crexx-${version_without_build}+${channel}.g${short_sha}"
          fi

          {
            echo "version=${version}"
            echo "channel=${channel}"
            echo "timestamp=${timestamp}"
            echo "commit=${source_commit}"
            echo "display_version=${display_version}"
            echo "release_name=${release_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Select candidate package lanes
        id: matrix
        shell: bash
        env:
          CREXX_CANDIDATE_LANE: ${{ inputs.lane || 'all' }}
        run: python3 scripts/ci-release-matrix.py

      - name: Check Windows publication safeguards
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_windows_release_assets.py' -v

      - name: Check provider signing and release matrix guards
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_llama_release_pipeline.py' -v

      - name: Check split package and shared runtime guards
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_split_release.py' -v

  build:
    name: ${{ matrix.name }}
    needs: version
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.core_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.version.outputs.commit }}

      - name: Python for package validation
        if: matrix.toolchain != 'mingw'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select MSVC C11 toolchain
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Configure
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCREXX_QA_CTEST_JOBS=${{ matrix.test_jobs }} \
            -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" \
            -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" \
            -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DENABLE_LLAMA=OFF \
            ${{ matrix.cmake_args }}

      - name: Build Release user product
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/build" \
            --target stage-product stage-optional \
            --parallel ${{ matrix.build_jobs }}

      - name: Run fast candidate QA
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/build" \
            --target qa-smoke \
            --parallel ${{ matrix.build_jobs }}

      - name: Configure, build and check MSVC Release product
        if: matrix.toolchain == 'msvc'
        shell: cmd
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/build" -DCMAKE_BUILD_TYPE=Release -DCREXX_QA_CTEST_JOBS=${{ matrix.test_jobs }} -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DENABLE_LLAMA=OFF ${{ matrix.cmake_args }}
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          cmake --build "${{ runner.temp }}/build" --target stage-product stage-optional --parallel ${{ matrix.build_jobs }}
          if not "%errorlevel%"=="0" exit /b %errorlevel%
          cmake --build "${{ runner.temp }}/build" --target qa-smoke --parallel ${{ matrix.build_jobs }}
          if not "%errorlevel%"=="0" exit /b %errorlevel%

      - name: Stage release payload
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          stage="${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}"
          mkdir -p "$stage/bin" "$stage/examples"

          cp -R "${{ runner.temp }}/build/bin/." "$stage/bin/"
          cp -R examples/. "$stage/examples/"
          cp -R "${{ runner.temp }}/build/example-artifacts/." "$stage/examples/"
          cp LICENSE README.md SECURITY.md INSTALL-RUN.md "$stage/"
          cp "${{ runner.temp }}/build/generated/VERSION" "$stage/VERSION"
          cp "${{ runner.temp }}/build/generated/BUILDINFO" "$stage/BUILDINFO"

      - name: Stage release payload
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $stage = Join-Path "${{ runner.temp }}" "release-payload/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "bin") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "examples") | Out-Null

          Copy-Item -Path (Join-Path "${{ runner.temp }}" "build/bin/*") -Destination (Join-Path $stage "bin") -Recurse -Force
          Copy-Item -Path "examples/*" -Destination (Join-Path $stage "examples") -Recurse -Force
          Copy-Item -Path (Join-Path "${{ runner.temp }}" "build/example-artifacts/*") -Destination (Join-Path $stage "examples") -Recurse -Force
          Copy-Item -Path "LICENSE", "README.md", "SECURITY.md", "INSTALL-RUN.md" -Destination $stage
          Copy-Item -Path (Join-Path "${{ runner.temp }}" "build/generated/VERSION") -Destination (Join-Path $stage "VERSION") -Force
          Copy-Item -Path (Join-Path "${{ runner.temp }}" "build/generated/BUILDINFO") -Destination (Join-Path $stage "BUILDINFO") -Force

      - name: Configure Apple signing keychain
        id: macos_signing
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_CERTIFICATE_BASE64)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_IDENTITY:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_IDENTITY)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "pkg_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping macOS code signing because Apple Developer ID Application secrets are not configured: ${missing[*]}"
            {
              echo "### macOS signing skipped"
              echo
              echo "Apple Developer ID Application secrets are not configured for this repository or fork:"
              printf -- "- \`%s\`\n" "${missing[@]}"
              echo
              echo "The workflow will continue and upload unsigned macOS ZIP assets. No macOS .pkg asset is produced by this workflow yet."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          application_certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          installer_certificate_path="${RUNNER_TEMP}/developer-id-installer.p12"
          keychain_path="${RUNNER_TEMP}/crexx-signing.keychain-db"
          keychain_password="$(uuidgen)"

          summarize_p12_certificate() {
            local label="$1"
            local certificate_path="$2"
            local certificate_password="$3"

            echo "${label} public certificate metadata:"
            if ! P12_PASSWORD="$certificate_password" openssl pkcs12 \
              -in "$certificate_path" \
              -passin env:P12_PASSWORD \
              -clcerts \
              -nokeys 2>/dev/null | openssl x509 -noout -subject -issuer -serial -fingerprint -sha256; then
              echo "::warning::Could not read ${label} public certificate metadata from the .p12 file."
            fi
          }

          detect_installer_identity() {
            local keychain="$1"
            security find-identity -v -p basic "$keychain" |
              awk -F\" '/Developer ID Installer:/ { print $2; exit }' ||
              true
          }

          normalize_identity() {
            local value="$1"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ "$value" == \"*\" && "$value" == *\" && ${#value} -ge 2 ]]; then
              value="${value:1:${#value}-2}"
              value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            fi
            printf '%s' "$value"
          }

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$application_certificate_path"
          summarize_p12_certificate "Developer ID Application" \
            "$application_certificate_path" \
            "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$application_certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          installer_missing=()
          if [ -z "${APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64:-}" ]; then
            installer_missing+=(APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD:-}" ]; then
            installer_missing+=(APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD)
          fi

          if [ "${#installer_missing[@]}" -eq 0 ]; then
            printf '%s' "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$installer_certificate_path"
            summarize_p12_certificate "Developer ID Installer" \
              "$installer_certificate_path" \
              "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD"
            security import "$installer_certificate_path" \
              -k "$keychain_path" \
              -P "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild \
              -T /usr/bin/productsign
            echo "pkg_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping macOS .pkg packaging because Apple Developer ID Installer secrets are not configured: ${installer_missing[*]}"
            {
              echo "### macOS .pkg packaging skipped"
              echo
              echo "Apple Developer ID Installer secrets are not configured for this repository or fork:"
              printf -- "- \`%s\`\n" "${installer_missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"

          echo "Valid basic identities in Apple signing keychain:"
          security find-identity -v -p basic "$keychain_path" || true
          echo "Valid code-signing identities in Apple signing keychain:"
          security find-identity -v -p codesigning "$keychain_path" || true

          if [ "${#installer_missing[@]}" -eq 0 ]; then
            installer_identity="$(detect_installer_identity "$keychain_path")"
            if [ -z "$installer_identity" ]; then
              echo "::error::No Developer ID Installer identity was found in the imported Installer .p12. Check APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 contains the Developer ID Installer .p12, not the Developer ID Application .p12 or a .cer file."
              exit 1
            fi

            if [ -n "${APPLE_DEVELOPER_ID_INSTALLER_IDENTITY:-}" ]; then
              configured_installer_identity="$(normalize_identity "$APPLE_DEVELOPER_ID_INSTALLER_IDENTITY")"
              if [ "$configured_installer_identity" != "$APPLE_DEVELOPER_ID_INSTALLER_IDENTITY" ]; then
                echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_IDENTITY contains surrounding quotes or whitespace; the workflow is using the imported certificate Common Name instead."
              fi
              if [ "$configured_installer_identity" != "$installer_identity" ]; then
                echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_IDENTITY does not match the imported Developer ID Installer certificate Common Name; the workflow is using the imported certificate Common Name instead."
              fi
            fi

            {
              echo "APPLE_DEVELOPER_ID_INSTALLER_IDENTITY_DETECTED<<__CREXX_INSTALLER_IDENTITY__"
              printf '%s\n' "$installer_identity"
              echo "__CREXX_INSTALLER_IDENTITY__"
            } >> "$GITHUB_ENV"
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign macOS release payload
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_DEVELOPER_ID_IDENTITY:-}" ]; then
            echo "APPLE_DEVELOPER_ID_IDENTITY is not set" >&2
            exit 1
          fi

          stage="${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}"
          entitlements="${GITHUB_WORKSPACE}/.github/signing/macos-plugin-host.entitlements"
          signed_count=0

          while IFS= read -r -d '' file_path; do
            if ! file "$file_path" | grep -q 'Mach-O'; then
              continue
            fi

            file_name="$(basename "$file_path")"
            sign_args=(--force --timestamp --options runtime --sign "$APPLE_DEVELOPER_ID_IDENTITY")

            case "$file_name" in
              crexx|rxc|rxvm|rxvme|rxbvm|rxbvme|rxpp|rxdb)
                sign_args+=(--entitlements "$entitlements")
                ;;
            esac

            echo "Signing $file_path"
            codesign "${sign_args[@]}" "$file_path"
            signed_count=$((signed_count + 1))
          done < <(find "$stage" -type f -print0)

          if [ "$signed_count" -eq 0 ]; then
            echo "No Mach-O files were found to sign" >&2
            exit 1
          fi

          echo "Signed $signed_count Mach-O files"

      - name: Verify macOS signatures
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          stage="${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}"

          while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$file_path"
            fi
          done < <(find "$stage" -type f -print0)

      - name: Package and smoke the actual core ZIP
        shell: bash
        run: |
          python scripts/package-core-release.py --source . --build "${{ runner.temp }}/build" \
            --payload "${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}" \
            --output "${{ runner.temp }}/core-package" --platform "${{ matrix.core_platform }}" \
            --toolchain "${{ matrix.toolchain }}" --preferred-vm "${{ matrix.preferred_vm }}" \
            --commit "${{ needs.version.outputs.commit }}"

      - name: Retain core QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-qa-${{ matrix.core_platform }}-${{ needs.version.outputs.commit }}
          path: |
            ${{ runner.temp }}/core-package/qa
            ${{ runner.temp }}/build/Testing/Temporary
            ${{ runner.temp }}/build/CMakeCache.txt
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
          retention-days: 14

      - name: Upload qualified core for consumers and plugin jobs
        uses: actions/upload-artifact@v7
        with:
          name: user-test-${{ needs.version.outputs.commit }}-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/core-package/assets/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Retain unqualified archive after a core packaging failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unqualified-core-${{ matrix.core_platform }}-${{ needs.version.outputs.commit }}
          path: ${{ runner.temp }}/core-package/assets/*.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Package release asset
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            package_id="dev-snapshot"
          else
            package_id="${GITHUB_REF_NAME}"
          fi

          payload="${{ matrix.artifact_name }}"
          suffix="${payload#CREXX-}"
          asset_dir="${{ runner.temp }}/release-assets"
          asset="CREXX-${package_id}-${suffix}.zip"

          mkdir -p "$asset_dir"
          cp "${{ runner.temp }}/core-package/assets/CREXX-user-test-${{ needs.version.outputs.commit }}-${suffix}.zip" "$asset_dir/$asset"
          echo "CREXX_RELEASE_ASSET=$asset_dir/$asset" >> "$GITHUB_ENV"

      - name: Package release asset
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/develop") {
            $packageId = "dev-snapshot"
          } else {
            $packageId = $env:GITHUB_REF_NAME
          }

          $payload = "${{ matrix.artifact_name }}"
          $suffix = $payload -replace "^CREXX-", ""
          $assetDir = Join-Path "${{ runner.temp }}" "release-assets"
          $asset = "CREXX-$packageId-$suffix.zip"
          $assetPath = Join-Path $assetDir $asset

          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $testedArchive = Join-Path "${{ runner.temp }}" "core-package/assets/CREXX-user-test-${{ needs.version.outputs.commit }}-$suffix.zip"
          Copy-Item -Path $testedArchive -Destination $assetPath -Force
          "CREXX_RELEASE_ASSET=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package macOS installer
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.pkg_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APPLE_DEVELOPER_ID_INSTALLER_IDENTITY_DETECTED:-}" ]; then
            echo "APPLE_DEVELOPER_ID_INSTALLER_IDENTITY_DETECTED is not set" >&2
            exit 1
          fi
          if [ -z "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            echo "APPLE_SIGNING_KEYCHAIN is not set" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/develop" ]; then
            package_id="dev-snapshot"
          else
            package_id="${GITHUB_REF_NAME}"
          fi

          payload="${{ matrix.artifact_name }}"
          suffix="${payload#CREXX-}"
          pkg_asset_dir="${{ runner.temp }}/macos-pkg-assets"
          pkg_asset="$pkg_asset_dir/CREXX-${package_id}-${suffix}.pkg"

          scripts/package-macos-pkg.sh \
            --payload-dir "${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}" \
            --output "$pkg_asset" \
            --package-version "${{ needs.version.outputs.display_version }}" \
            --sign-identity "$APPLE_DEVELOPER_ID_INSTALLER_IDENTITY_DETECTED" \
            --keychain "$APPLE_SIGNING_KEYCHAIN"

          pkgutil --check-signature "$pkg_asset"
          echo "CREXX_MACOS_PKG_ASSET=$pkg_asset" >> "$GITHUB_ENV"

      - name: Package Linux Debian dev snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.platform == 'linux' && !matrix.cuda
        shell: bash
        run: |
          set -euo pipefail

          asset_dir="${{ runner.temp }}/release-assets"
          scripts/package-linux-deb.sh \
            --payload-dir "${{ runner.temp }}/release-payload/${{ matrix.artifact_name }}" \
            --output "$asset_dir/CREXX-dev-snapshot-linux-x64.deb" \
            --display-version "${{ needs.version.outputs.display_version }}"

      - name: Build and test unsigned Windows snapshot installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && matrix.platform == 'windows' && !matrix.cuda
        shell: pwsh
        timeout-minutes: 10
        run: |
          $payload = Join-Path "${{ runner.temp }}" "release-payload/${{ matrix.artifact_name }}"
          $installer = Join-Path "${{ runner.temp }}" 'release-assets/CREXX-dev-snapshot-windows-x64-unsigned-setup.exe'
          & "$env:GITHUB_WORKSPACE/.github/scripts/build-windows-installer.ps1" -Payload $payload -Installer $installer -Commit '${{ needs.version.outputs.commit }}'

      - name: Report macOS package status
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### macOS package status"
            echo
            echo "This workflow publishes the macOS ZIP asset as a portable archive."
            if [ "${{ steps.macos_signing.outputs.pkg_enabled }}" = "true" ]; then
              echo "A signed .pkg installer was built and will be uploaded after notarization and stapling succeed."
            else
              echo "No macOS .pkg asset is produced because Developer ID Installer signing is not configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notarize macOS ZIP asset
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${APPLE_ID:-}" ]; then
            missing+=(APPLE_ID)
          fi
          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            missing+=(APPLE_TEAM_ID)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping macOS notarization because Apple notarization secrets are not configured: ${missing[*]}"
            {
              echo "### macOS notarization skipped"
              echo
              echo "The macOS ZIP payload was signed, but notarization secrets are not configured:"
              printf -- "- \`%s\`\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          xcrun notarytool submit "$CREXX_RELEASE_ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Notarize and staple macOS installer
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.pkg_enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${APPLE_ID:-}" ]; then
            missing+=(APPLE_ID)
          fi
          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            missing+=(APPLE_TEAM_ID)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping macOS .pkg notarization because Apple notarization secrets are not configured: ${missing[*]}"
            {
              echo "### macOS .pkg notarization skipped"
              echo
              echo "The macOS .pkg was signed, but it will not be uploaded because notarization secrets are not configured:"
              printf -- "- \`%s\`\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -z "${CREXX_MACOS_PKG_ASSET:-}" ]; then
            echo "CREXX_MACOS_PKG_ASSET is not set" >&2
            exit 1
          fi

          xcrun notarytool submit "$CREXX_MACOS_PKG_ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$CREXX_MACOS_PKG_ASSET"
          xcrun stapler validate "$CREXX_MACOS_PKG_ASSET"
          spctl --assess --type install --verbose=4 "$CREXX_MACOS_PKG_ASSET"

          mkdir -p "${{ runner.temp }}/release-assets"
          cp "$CREXX_MACOS_PKG_ASSET" "${{ runner.temp }}/release-assets/"

      - name: Upload packaged asset
        if: github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-release-asset
          path: ${{ runner.temp }}/release-assets/CREXX-*
          if-no-files-found: error

      - name: Cleanup Apple signing keychain
        if: always() && (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

  mingw-core:
    name: Windows MinGW core quality gate (no binary delivery)
    needs: version
    if: github.event_name != 'create' || (github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    uses: ./.github/workflows/release-core.yml
    with:
      commit: ${{ needs.version.outputs.commit }}
      platform: windows-mingw

  llama:
    name: Plugin ${{ matrix.name }}
    needs: [version, build, mingw-core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.version.outputs.commit }}

      - name: Python for package validation
        if: matrix.toolchain != 'mingw'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Vulkan build prerequisites
        if: matrix.platform == 'linux' && !matrix.cuda
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev glslc spirv-headers

      - name: Select MSVC C11 toolchain
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Cache pinned Windows Vulkan SDK
        if: matrix.toolchain == 'msvc' && matrix.backend == 'vulkan'
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/crexx-vulkan
          key: crexx-vulkan-${{ runner.os }}-${{ hashFiles('.github/llama/vulkan-windows.json') }}

      - name: Prepare pinned Windows Vulkan SDK
        if: matrix.toolchain == 'msvc' && matrix.backend == 'vulkan'
        shell: pwsh
        run: ./scripts/ci-vulkan-sdk.ps1 -Root "${{ runner.temp }}/crexx-vulkan"

      - name: Cache pinned CUDA build SDK
        id: cuda-cache
        if: matrix.cuda
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/crexx-cuda
          key: crexx-cuda-${{ runner.os }}-${{ hashFiles('.github/llama/cuda-12.9.1.json') }}

      - name: Assemble pinned CUDA build SDK
        if: matrix.cuda
        shell: bash
        run: python scripts/ci-cuda-toolkit.py --root "${{ runner.temp }}/crexx-cuda" --platform "${{ matrix.platform }}-x86_64"

      - name: Retain verified CUDA SDK before compilation
        if: matrix.cuda && steps.cuda-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/crexx-cuda
          key: crexx-cuda-${{ runner.os }}-${{ hashFiles('.github/llama/cuda-12.9.1.json') }}

      - name: Cache CUDA compiler outputs
        id: compiler-cache
        if: matrix.cuda
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: "v0.16.0"

      - name: Download the qualified matching core
        uses: actions/download-artifact@v8
        with:
          name: user-test-${{ needs.version.outputs.commit }}-CREXX-${{ matrix.core_platform }}
          path: ${{ runner.temp }}/core-download

      - name: Check dependency scanning with tiny package libraries
        shell: bash
        run: |
          cmake -S tests/rxpa/provider-package-copy -G Ninja \
            -B "${{ runner.temp }}/package-scan" -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.platform == 'windows' && '-DCMAKE_C_COMPILER=cl' || '' }}
          cmake --build "${{ runner.temp }}/package-scan" --parallel 2
          ctest --test-dir "${{ runner.temp }}/package-scan" --output-on-failure

      - name: Configure plugin and engine only
        shell: bash
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/build" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_LLAMA=ON \
            -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" \
            -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" \
            -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON ${{ matrix.cmake_args }}

      - name: Check MSVC runtime identity before engine compilation
        if: matrix.toolchain == 'msvc'
        shell: bash
        run: |
          python scripts/package-llama-release.py --check-msvc-runtime-only \
            --core-archive "${{ runner.temp }}/core-download/CREXX-user-test-${{ needs.version.outputs.commit }}-${{ matrix.core_platform }}.zip" \
            --build "${{ runner.temp }}/build" --output "${{ runner.temp }}/runtime-preflight" \
            --commit "${{ needs.version.outputs.commit }}" --platform "${{ matrix.core_platform }}" \
            --toolchain "${{ matrix.toolchain }}" --backend "${{ matrix.backend }}"

      - name: Build plugin, dependency and focused QA targets
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/build" --parallel ${{ matrix.build_jobs }} \
            --target llama_provider_runtime_package crexx-provider-package rxllama_release_engine_smoke \
            rxllama_bridge_lifecycle rxllama_package_utf8_cxx17 rxllama_package_utf8_cxx20

      - name: Check provider lifecycle and package boundaries
        shell: bash
        run: |
          ctest --test-dir "${{ runner.temp }}/build" --parallel 1 --output-on-failure \
            -R '^rxllama_(backend_probe_cycle|package_windows_paths|package_utf8_cxx(17|20))$'

      - name: Stage optional plugin against the unchanged core
        shell: bash
        run: |
          python scripts/package-llama-release.py --stage-only \
            --core-archive "${{ runner.temp }}/core-download/CREXX-user-test-${{ needs.version.outputs.commit }}-${{ matrix.core_platform }}.zip" \
            --build "${{ runner.temp }}/build" --output "${{ runner.temp }}/plugin-package" \
            --commit "${{ needs.version.outputs.commit }}" --platform "${{ matrix.core_platform }}" \
            --toolchain "${{ matrix.toolchain }}" --backend "${{ matrix.backend }}"

      - name: Configure Apple signing keychain
        id: macos_signing
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${APPLE_DEVELOPER_ID_CERTIFICATE_BASE64:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_CERTIFICATE_BASE64)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_IDENTITY:-}" ]; then
            missing+=(APPLE_DEVELOPER_ID_IDENTITY)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "pkg_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping macOS code signing because Apple Developer ID Application secrets are not configured: ${missing[*]}"
            {
              echo "### macOS signing skipped"
              echo
              echo "Apple Developer ID Application secrets are not configured for this repository or fork:"
              printf -- "- \`%s\`\n" "${missing[@]}"
              echo
              echo "The workflow will continue and upload unsigned macOS ZIP assets. No macOS .pkg asset is produced by this workflow yet."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          application_certificate_path="${RUNNER_TEMP}/developer-id-application.p12"
          installer_certificate_path="${RUNNER_TEMP}/developer-id-installer.p12"
          keychain_path="${RUNNER_TEMP}/crexx-signing.keychain-db"
          keychain_password="$(uuidgen)"

          summarize_p12_certificate() {
            local label="$1"
            local certificate_path="$2"
            local certificate_password="$3"

            echo "${label} public certificate metadata:"
            if ! P12_PASSWORD="$certificate_password" openssl pkcs12 \
              -in "$certificate_path" \
              -passin env:P12_PASSWORD \
              -clcerts \
              -nokeys 2>/dev/null | openssl x509 -noout -subject -issuer -serial -fingerprint -sha256; then
              echo "::warning::Could not read ${label} public certificate metadata from the .p12 file."
            fi
          }

          detect_installer_identity() {
            local keychain="$1"
            security find-identity -v -p basic "$keychain" |
              awk -F\" '/Developer ID Installer:/ { print $2; exit }' ||
              true
          }

          normalize_identity() {
            local value="$1"
            value="${value//$'\r'/}"
            value="${value//$'\n'/}"
            value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [[ "$value" == \"*\" && "$value" == *\" && ${#value} -ge 2 ]]; then
              value="${value:1:${#value}-2}"
              value="$(printf '%s' "$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            fi
            printf '%s' "$value"
          }

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$application_certificate_path"
          summarize_p12_certificate "Developer ID Application" \
            "$application_certificate_path" \
            "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$application_certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          installer_missing=()
          if [ -z "${APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64:-}" ]; then
            installer_missing+=(APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64)
          fi
          if [ -z "${APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD:-}" ]; then
            installer_missing+=(APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD)
          fi

          if [ "${#installer_missing[@]}" -eq 0 ]; then
            printf '%s' "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64" | base64 -D > "$installer_certificate_path"
            summarize_p12_certificate "Developer ID Installer" \
              "$installer_certificate_path" \
              "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD"
            security import "$installer_certificate_path" \
              -k "$keychain_path" \
              -P "$APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD" \
              -T /usr/bin/pkgbuild \
              -T /usr/bin/productbuild \
              -T /usr/bin/productsign
            echo "pkg_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping macOS .pkg packaging because Apple Developer ID Installer secrets are not configured: ${installer_missing[*]}"
            {
              echo "### macOS .pkg packaging skipped"
              echo
              echo "Apple Developer ID Installer secrets are not configured for this repository or fork:"
              printf -- "- \`%s\`\n" "${installer_missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain_path"

          echo "Valid basic identities in Apple signing keychain:"
          security find-identity -v -p basic "$keychain_path" || true
          echo "Valid code-signing identities in Apple signing keychain:"
          security find-identity -v -p codesigning "$keychain_path" || true

          if [ "${#installer_missing[@]}" -eq 0 ]; then
            installer_identity="$(detect_installer_identity "$keychain_path")"
            if [ -z "$installer_identity" ]; then
              echo "::error::No Developer ID Installer identity was found in the imported Installer .p12. Check APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 contains the Developer ID Installer .p12, not the Developer ID Application .p12 or a .cer file."
              exit 1
            fi

            if [ -n "${APPLE_DEVELOPER_ID_INSTALLER_IDENTITY:-}" ]; then
              configured_installer_identity="$(normalize_identity "$APPLE_DEVELOPER_ID_INSTALLER_IDENTITY")"
              if [ "$configured_installer_identity" != "$APPLE_DEVELOPER_ID_INSTALLER_IDENTITY" ]; then
                echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_IDENTITY contains surrounding quotes or whitespace; the workflow is using the imported certificate Common Name instead."
              fi
              if [ "$configured_installer_identity" != "$installer_identity" ]; then
                echo "::warning::APPLE_DEVELOPER_ID_INSTALLER_IDENTITY does not match the imported Developer ID Installer certificate Common Name; the workflow is using the imported certificate Common Name instead."
              fi
            fi

            {
              echo "APPLE_DEVELOPER_ID_INSTALLER_IDENTITY_DETECTED<<__CREXX_INSTALLER_IDENTITY__"
              printf '%s\n' "$installer_identity"
              echo "__CREXX_INSTALLER_IDENTITY__"
            } >> "$GITHUB_ENV"
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Sign macOS release payload
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_DEVELOPER_ID_IDENTITY:-}" ]; then
            echo "APPLE_DEVELOPER_ID_IDENTITY is not set" >&2
            exit 1
          fi

          stage="${{ runner.temp }}/plugin-package/plugin-stage/CREXX-${{ matrix.core_platform }}"
          entitlements="${GITHUB_WORKSPACE}/.github/signing/macos-plugin-host.entitlements"
          signed_count=0

          while IFS= read -r -d '' file_path; do
            if ! file "$file_path" | grep -q 'Mach-O'; then
              continue
            fi

            file_name="$(basename "$file_path")"
            sign_args=(--force --timestamp --options runtime --sign "$APPLE_DEVELOPER_ID_IDENTITY")

            case "$file_name" in
              crexx|rxc|rxvm|rxvme|rxbvm|rxbvme|rxpp|rxdb)
                sign_args+=(--entitlements "$entitlements")
                ;;
            esac

            echo "Signing $file_path"
            codesign "${sign_args[@]}" "$file_path"
            signed_count=$((signed_count + 1))
          done < <(find "$stage" -type f -print0)

          if [ "$signed_count" -eq 0 ]; then
            echo "No Mach-O files were found to sign" >&2
            exit 1
          fi

          echo "Signed $signed_count Mach-O files"

      - name: Verify macOS signatures
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail

          stage="${{ runner.temp }}/plugin-package/plugin-stage/CREXX-${{ matrix.core_platform }}"

          while IFS= read -r -d '' file_path; do
            if file "$file_path" | grep -q 'Mach-O'; then
              codesign --verify --strict --verbose=2 "$file_path"
            fi
          done < <(find "$stage" -type f -print0)

      - name: Refresh verified macOS provider hashes
        if: matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        run: python scripts/refresh-provider-manifests.py "${{ runner.temp }}/plugin-package/plugin-stage/CREXX-${{ matrix.core_platform }}/bin/providers"

      - name: Preserve CUDA redistributable notices
        if: matrix.cuda
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/plugin-package/plugin-stage/CREXX-${{ matrix.core_platform }}/share/crexx/llama/cuda-licenses"
          cp -R "${{ runner.temp }}/crexx-cuda/licenses/." "${{ runner.temp }}/plugin-package/plugin-stage/CREXX-${{ matrix.core_platform }}/share/crexx/llama/cuda-licenses/"

      - name: Package plugin and reconstruct the actual downloads
        shell: bash
        run: |
          python scripts/package-llama-release.py --finalize-only \
            --core-archive "${{ runner.temp }}/core-download/CREXX-user-test-${{ needs.version.outputs.commit }}-${{ matrix.core_platform }}.zip" \
            --build "${{ runner.temp }}/build" --output "${{ runner.temp }}/plugin-package" \
            --commit "${{ needs.version.outputs.commit }}" --platform "${{ matrix.core_platform }}" \
            --toolchain "${{ matrix.toolchain }}" --backend "${{ matrix.backend }}"

      - name: Smoke combined core and plugin downloads
        shell: bash
        run: |
          python tests/native-inference/release_smoke.py --source . \
            --build "${{ runner.temp }}/build" \
            --helper "${{ runner.temp }}/build/lib/plugins/llama/tests/rxllama_release_engine_smoke${{ matrix.platform == 'windows' && '.exe' || '' }}" \
            --payload "${{ runner.temp }}/plugin-package/combined/CREXX-${{ matrix.core_platform }}" \
            --backends "${{ matrix.backends }}" --output-root "${{ runner.temp }}/release-smoke"

      - name: Record CUDA compiler cache statistics
        if: always() && matrix.cuda && steps.compiler-cache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/compiler-cache"
          sccache --show-stats > "${{ runner.temp }}/compiler-cache/stats.txt"
          sccache --show-stats --stats-format=json > "${{ runner.temp }}/compiler-cache/stats.json"
          cat "${{ runner.temp }}/compiler-cache/stats.txt"

      - name: Retain plugin QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-qa-${{ matrix.artifact_name }}-${{ needs.version.outputs.commit }}
          path: |
            ${{ runner.temp }}/plugin-package/qa
            ${{ runner.temp }}/release-smoke
            ${{ runner.temp }}/build/Testing/Temporary
            ${{ runner.temp }}/build/CMakeCache.txt
            ${{ runner.temp }}/build/CMakeFiles/CMakeConfigureLog.yaml
            ${{ runner.temp }}/build/lib/plugins/llama/tests/release-smoke-msvc-runtime-files.txt
            ${{ runner.temp }}/compiler-cache
            ${{ runner.temp }}/package-scan/Testing/Temporary
            ${{ runner.temp }}/package-scan/proof/*.log
            ${{ runner.temp }}/package-scan/proof/*.cmake
            ${{ runner.temp }}/package-scan/proof/complete/*.json
          retention-days: 14

      - name: Upload qualified optional plugin
        uses: actions/upload-artifact@v7
        with:
          name: user-test-${{ needs.version.outputs.commit }}-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/plugin-package/assets/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Name optional plugin release asset
        if: github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ needs.version.outputs.channel }}" = "dev-snapshot" ]; then
            package_id=dev-snapshot
          else
            package_id="$GITHUB_REF_NAME"
          fi
          mkdir -p "${{ runner.temp }}/release-assets"
          asset="${{ runner.temp }}/release-assets/llama.rexx-${package_id}-${{ matrix.core_platform }}-${{ matrix.backend }}.zip"
          cp "${{ runner.temp }}/plugin-package/assets/llama.rexx-user-test-${{ needs.version.outputs.commit }}-${{ matrix.core_platform }}-${{ matrix.backend }}.zip" "$asset"
          echo "CREXX_RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Notarize macOS ZIP asset
        if: (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos' && steps.macos_signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=()
          if [ -z "${APPLE_ID:-}" ]; then
            missing+=(APPLE_ID)
          fi
          if [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ]; then
            missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          fi
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            missing+=(APPLE_TEAM_ID)
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping macOS notarization because Apple notarization secrets are not configured: ${missing[*]}"
            {
              echo "### macOS notarization skipped"
              echo
              echo "The macOS ZIP payload was signed, but notarization secrets are not configured:"
              printf -- "- \`%s\`\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          xcrun notarytool submit "$CREXX_RELEASE_ASSET" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload plugin release asset
        if: github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}-release-asset
          path: ${{ runner.temp }}/release-assets/llama.rexx-*.zip
          if-no-files-found: error

      - name: Cleanup Apple signing keychain
        if: always() && (github.event_name == 'create' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${APPLE_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$APPLE_SIGNING_KEYCHAIN" || true
          fi

  optimizer-parity:
    name: Linux Debug Optimizer Parity
    needs: version
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.version.outputs.commit }}

      - name: Configure Debug parity build
        shell: bash
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/debug-parity" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCREXX_QA_CTEST_JOBS=5 \
            -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" \
            -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" \
            -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DENABLE_LLAMA=OFF

      - name: Run optimized/non-optimized correctness parity
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/debug-parity" \
            --target qa-optimizer-parity \
            --parallel 2

  comprehensive:
    name: Comprehensive ${{ matrix.name }}
    needs: version
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/heads/temp/llama-release-')) || (github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux
            build_jobs: 2
            test_jobs: 5
            cmake_args: ""
          - name: Windows x64 MinGW
            os: windows-2025
            platform: windows
            toolchain: mingw
            build_jobs: 4
            test_jobs: 2
            cmake_args: "-DCREXX_FORCE_SYSTEM_OPENSSL=ON"
          - name: Windows x64 MSVC
            os: windows-2025
            platform: windows
            toolchain: msvc
            build_jobs: 2
            test_jobs: 2
            cmake_args: "-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DENABLE_PARSER_MODE=OFF"
          - name: macOS arm64
            os: macos-15
            platform: macos
            build_jobs: 2
            test_jobs: 5
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - name: macOS x86_64
            os: macos-15-intel
            platform: macos
            build_jobs: 2
            test_jobs: 5
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.version.outputs.commit }}

      - name: Select MSVC C11 toolchain
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Update toolchain (MSYS2)
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            openssl:p
            pkgconf:p

      - name: Configure Release qualification build
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/qualification" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCREXX_QA_CTEST_JOBS=${{ matrix.test_jobs }} \
            -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" \
            -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" \
            -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" \
            -DCREXX_ALLOW_NETWORK_DOWNLOADS=ON -DENABLE_LLAMA=OFF \
            ${{ matrix.cmake_args }}

      - name: Configure Release qualification build
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake -S . -G Ninja -B "${{ runner.temp }}/qualification" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCREXX_QA_CTEST_JOBS=${{ matrix.test_jobs }} \
            -DCREXX_VERSION_OVERRIDE="${{ needs.version.outputs.version }}" \
            -DCREXX_BUILD_CHANNEL="${{ needs.version.outputs.channel }}" \
            -DCREXX_BUILD_TIMESTAMP="${{ needs.version.outputs.timestamp }}" \
            -DCREXX_BUILD_COMMIT="${{ needs.version.outputs.commit }}" \
            ${{ matrix.cmake_args }}

      - name: Run comprehensive correctness QA
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/qualification" \
            --target qa-comprehensive \
            --parallel ${{ matrix.build_jobs }}

      - name: Run comprehensive correctness QA
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake --build "${{ runner.temp }}/qualification" \
            --target qa-comprehensive \
            --parallel ${{ matrix.build_jobs }}

      - name: Run install/package/external-consumer qualification
        if: matrix.toolchain != 'mingw'
        shell: bash
        run: |
          cmake --build "${{ runner.temp }}/qualification" \
            --target qa-qualification \
            --parallel ${{ matrix.build_jobs }}

      - name: Run install/package/external-consumer qualification
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        run: |
          cmake --build "${{ runner.temp }}/qualification" \
            --target qa-qualification \
            --parallel ${{ matrix.build_jobs }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - build
      - llama
      - mingw-core
      - comprehensive
      - version
    if: github.event_name == 'create' && github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release-asset'
          path: ${{ runner.temp }}/downloaded-release-assets

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail

          download_dir="${{ runner.temp }}/downloaded-release-assets"
          asset_dir="${{ runner.temp }}/release-assets"
          mkdir -p "$asset_dir"

          find "$download_dir" \
            \( -name 'CREXX-*.zip' -o -name 'llama.rexx-*.zip' -o -name 'CREXX-*.pkg' \) \
            -type f -exec cp {} "$asset_dir/" \;

          zip_count="$(find "$asset_dir" -name '*.zip' -type f | wc -l | tr -d ' ')"
          if [ "$zip_count" != "10" ]; then
            echo "Expected 4 core and 6 plugin release ZIP assets, found $zip_count" >&2
            exit 1
          fi

          core_count="$(find "$asset_dir" -name 'CREXX-*.zip' -type f | wc -l | tr -d ' ')"
          plugin_count="$(find "$asset_dir" -name 'llama.rexx-*.zip' -type f | wc -l | tr -d ' ')"
          if [ "$core_count" != "4" ] || [ "$plugin_count" != "6" ]; then
            echo "Invalid split: $core_count core ZIPs and $plugin_count plugin ZIPs" >&2
            exit 1
          fi

          pkg_count="$(find "$asset_dir" -name 'CREXX-*.pkg' -type f | wc -l | tr -d ' ')"
          if [ "$pkg_count" != "0" ] && [ "$pkg_count" != "2" ]; then
            echo "Expected 0 or 2 release PKG assets, found $pkg_count" >&2
            exit 1
          fi

          ls -lh "$asset_dir"

      - name: Determine release metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          echo "RELEASE_NAME=${{ needs.version.outputs.release_name }}" >> "$GITHUB_ENV"

          case "$tag" in
            *alpha*|*beta*|*rc*|*test*)
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          notes_file="docs/releases/${tag}.md"
          release_notes="${RUNNER_TEMP}/release-notes.md"

          if [ -f "$notes_file" ]; then
            cp "$notes_file" "$release_notes"
          else
            {
              echo "# CREXX ${tag#v}"
              echo
              echo "Automated release for ${tag}."
              echo
              echo "No curated release notes file was found at \`${notes_file}\`."
            } > "$release_notes"
          fi

          echo "RELEASE_NOTES_PATH=$release_notes" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ env.PRERELEASE }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/release-assets/*

  dev-snapshot:
    name: Publish Dev Snapshot
    runs-on: ubuntu-24.04
    needs:
      - build
      - llama
      - mingw-core
      - optimizer-parity
      - version
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: crexx-dev-snapshot
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify develop still points at this commit
        id: publish_target
        shell: bash
        run: |
          set -euo pipefail

          latest_develop_sha="$(git ls-remote origin refs/heads/develop | awk '{print $1}')"
          if [ "$latest_develop_sha" != "$GITHUB_SHA" ]; then
            echo "develop now points at $latest_develop_sha; this run built $GITHUB_SHA."
            echo "Skipping dev snapshot publish so an older run cannot replace a newer build."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Download packaged assets
        if: steps.publish_target.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: '*-release-asset'
          path: ${{ runner.temp }}/downloaded-dev-snapshot-assets

      - name: Collect dev snapshot assets
        if: steps.publish_target.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          download_dir="${{ runner.temp }}/downloaded-dev-snapshot-assets"
          asset_dir="${{ runner.temp }}/dev-snapshot-assets"
          mkdir -p "$asset_dir"

          find "$download_dir" \
            \( -name 'llama.rexx-dev-snapshot-*.zip' -o -name 'CREXX-dev-snapshot-*.zip' -o -name 'CREXX-dev-snapshot-*.deb' -o -name 'CREXX-dev-snapshot-*.pkg' -o -name 'CREXX-dev-snapshot-*.exe' \) \
            -type f -exec cp {} "$asset_dir/" \;

          expected_assets=(
            CREXX-dev-snapshot-linux-x64.zip
            llama.rexx-dev-snapshot-linux-x64-vulkan.zip
            llama.rexx-dev-snapshot-linux-x64-cuda.zip
            llama.rexx-dev-snapshot-windows-x64-vulkan.zip
            llama.rexx-dev-snapshot-windows-x64-cuda.zip
            llama.rexx-dev-snapshot-macos-arm64-metal.zip
            llama.rexx-dev-snapshot-macos-x86_64-cpu.zip
            CREXX-dev-snapshot-linux-x64.deb
            CREXX-dev-snapshot-windows-x64.zip
            CREXX-dev-snapshot-windows-x64-unsigned-setup.exe
            CREXX-dev-snapshot-macos-arm64.zip
            CREXX-dev-snapshot-macos-x86_64.zip
          )

          pkg_count="$(find "$asset_dir" -maxdepth 1 -name 'CREXX-dev-snapshot-macos-*.pkg' -type f | wc -l | tr -d ' ')"
          if [ "$pkg_count" = "2" ]; then
            expected_assets+=(
              CREXX-dev-snapshot-macos-arm64.pkg
              CREXX-dev-snapshot-macos-x86_64.pkg
            )
          elif [ "$pkg_count" != "0" ]; then
            echo "Expected 0 or 2 dev snapshot macOS PKG assets, found $pkg_count" >&2
            find "$asset_dir" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          for asset in "${expected_assets[@]}"; do
            if [ ! -f "$asset_dir/$asset" ]; then
              echo "Missing dev snapshot asset: $asset" >&2
              find "$asset_dir" -maxdepth 1 -type f -print >&2
              exit 1
            fi
          done

          asset_count="$(find "$asset_dir" -maxdepth 1 \( -name 'CREXX-dev-snapshot-*' -o -name 'llama.rexx-dev-snapshot-*' \) -type f | wc -l | tr -d ' ')"
          if [ "$asset_count" != "${#expected_assets[@]}" ]; then
            echo "Expected ${#expected_assets[@]} dev snapshot assets, found $asset_count" >&2
            find "$asset_dir" -maxdepth 1 -type f -print >&2
            exit 1
          fi

          ls -lh "$asset_dir"

      - name: Prepare dev snapshot notes
        if: steps.publish_target.outputs.should_publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          notes_file="${RUNNER_TEMP}/dev-snapshot-notes.md"
          short_sha="${GITHUB_SHA:0:12}"

          {
            echo "# ${{ needs.version.outputs.release_name }}"
            echo
            echo "This is the latest successful build from the \`develop\` branch."
            echo "It is replaced by the next successful \`develop\` build and is not a versioned release."
            echo
            echo "- Version: \`${{ needs.version.outputs.display_version }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Built: \`${{ needs.version.outputs.timestamp }}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Core downloads contain cREXX. For local inference, add the matching llama.rexx platform/backend ZIP and download a supported model separately. One MSVC Windows core supports either Vulkan or CUDA. MinGW is a core quality gate only."
            echo
            echo "macOS .pkg assets, when present, are signed, notarized, stapled installers. macOS ZIP assets remain portable archives."
            echo "Windows testers: use \`CREXX-dev-snapshot-windows-x64-unsigned-setup.exe\` for installation, or \`CREXX-dev-snapshot-windows-x64.zip\` as the portable archive. Both are built automatically from commit \`${short_sha}\`. Unsigned applications may show Windows security warnings or be blocked by policy."
            echo
            echo "Optional \`CREXX-dev-snapshot-windows-x64-signed-setup.exe\` and \`CREXX-dev-snapshot-windows-x64-signed.zip\` are added together when the maintainer runs \`scripts/sign-windows-dev-snapshot.sh\`. Their payload, embedded uninstaller and setup are signed. Unsigned downloads remain available. Previous signed assets and legacy installers are removed whenever the snapshot is refreshed."
            echo
            echo '### Automatic asset SHA-256 checksums'
            echo
            echo '```text'
            (cd "${{ runner.temp }}/dev-snapshot-assets" && sha256sum CREXX-dev-snapshot-* llama.rexx-dev-snapshot-*)
            echo '```'
          } > "$notes_file"

          echo "DEV_SNAPSHOT_NOTES_PATH=$notes_file" >> "$GITHUB_ENV"

      - name: Publish dev snapshot release
        if: steps.publish_target.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_TAG: dev-snapshot
          SNAPSHOT_NAME: ${{ needs.version.outputs.release_name }}
        run: |
          set -euo pipefail

          asset_dir="${{ runner.temp }}/dev-snapshot-assets"
          upload_dir="${{ runner.temp }}/dev-snapshot-upload"
          mkdir -p "$upload_dir"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$SNAPSHOT_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/${SNAPSHOT_TAG}" --force

          if gh release view "$SNAPSHOT_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$SNAPSHOT_TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "$SNAPSHOT_NAME" \
              --notes-file "$DEV_SNAPSHOT_NOTES_PATH" \
              --prerelease \
              --latest=false
          else
            gh release create "$SNAPSHOT_TAG" \
              -R "$GITHUB_REPOSITORY" \
              --title "$SNAPSHOT_NAME" \
              --notes-file "$DEV_SNAPSHOT_NOTES_PATH" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi

          asset_api_path() {
            local name="$1"
            gh release view "$SNAPSHOT_TAG" \
              -R "$GITHUB_REPOSITORY" \
              --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .apiUrl" |
              sed 's#^https://api.github.com/##'
          }

          delete_stale_temp_assets() {
            local temp_api_path
            while IFS= read -r temp_api_path; do
              [ -n "$temp_api_path" ] || continue
              gh api -X DELETE "$temp_api_path"
            done < <(
              gh release view "$SNAPSHOT_TAG" \
                -R "$GITHUB_REPOSITORY" \
                --json assets \
                --jq '.assets[] | select(.name | (startswith("CREXX-dev-snapshot-") or startswith("llama.rexx-dev-snapshot-")) and (endswith(".tmp.zip") or endswith(".tmp.deb") or endswith(".tmp.pkg") or endswith(".tmp.exe") or endswith(".tmp.json"))) | .apiUrl' |
                sed 's#^https://api.github.com/##'
            )
          }

          temp_asset_name() {
            local asset="$1"
            case "$asset" in
              *.zip)
                echo "${asset%.zip}-${GITHUB_RUN_ID}.tmp.zip"
                ;;
              *.deb)
                echo "${asset%.deb}-${GITHUB_RUN_ID}.tmp.deb"
                ;;
              *.pkg)
                echo "${asset%.pkg}-${GITHUB_RUN_ID}.tmp.pkg"
                ;;
              *.exe)
                echo "${asset%.exe}-${GITHUB_RUN_ID}.tmp.exe"
                ;;
              *)
                echo "${asset}-${GITHUB_RUN_ID}.tmp"
                ;;
            esac
          }

          mapfile -t expected_assets < <(
            find "$asset_dir" -maxdepth 1 \( -name 'CREXX-dev-snapshot-*' -o -name 'llama.rexx-dev-snapshot-*' \) -type f -exec basename {} \; |
              sort
          )
          if [ "${#expected_assets[@]}" -eq 0 ]; then
            echo "No dev snapshot assets collected for upload" >&2
            exit 1
          fi

          asset_is_expected() {
            local needle="$1"
            local expected
            for expected in "${expected_assets[@]}"; do
              if [ "$expected" = "$needle" ]; then
                return 0
              fi
            done
            return 1
          }

          delete_stale_temp_assets

          for asset in "${expected_assets[@]}"; do
            temp_asset="$(temp_asset_name "$asset")"
            cp "$asset_dir/$asset" "$upload_dir/$temp_asset"
          done

          gh release upload "$SNAPSHOT_TAG" "$upload_dir"/* \
            -R "$GITHUB_REPOSITORY" \
            --clobber

          for asset in "${expected_assets[@]}"; do
            temp_asset="$(temp_asset_name "$asset")"
            temp_api_path="$(asset_api_path "$temp_asset")"
            if [ -z "$temp_api_path" ]; then
              echo "Uploaded temporary asset is not visible: $temp_asset" >&2
              exit 1
            fi

            current_api_path="$(asset_api_path "$asset" || true)"
            if [ -n "$current_api_path" ]; then
              gh api -X DELETE "$current_api_path"
            fi

            gh api -X PATCH "$temp_api_path" -f name="$asset"
          done

          # Signed derivatives and the old ambiguous setup name belong to the
          # previous snapshot. Keep only the freshly published unsigned installer.
          for stale_windows_asset in \
            CREXX-dev-snapshot-windows-x64-signed.zip \
            CREXX-dev-snapshot-windows-x64-signed-setup.exe \
            CREXX-dev-snapshot-windows-x64-setup.exe; do
            stale_windows_api_path="$(asset_api_path "$stale_windows_asset" || true)"
            if [ -n "$stale_windows_api_path" ]; then
              gh api -X DELETE "$stale_windows_api_path"
            fi
          done

          for stale_optional_asset in \
            CREXX-dev-snapshot-linux-x64-cuda.zip \
            CREXX-dev-snapshot-windows-x64-cuda.zip \
            CREXX-dev-snapshot-macos-arm64.pkg \
            CREXX-dev-snapshot-macos-x86_64.pkg; do
            if ! asset_is_expected "$stale_optional_asset"; then
              stale_optional_api_path="$(asset_api_path "$stale_optional_asset" || true)"
              if [ -n "$stale_optional_api_path" ]; then
                gh api -X DELETE "$stale_optional_api_path"
              fi
            fi
          done

          for asset in "${expected_assets[@]}"; do
            final_api_path="$(asset_api_path "$asset")"
            if [ -z "$final_api_path" ]; then
              echo "Final dev snapshot asset is not visible: $asset" >&2
              exit 1
            fi
          done

          delete_stale_temp_assets

          gh release view "$SNAPSHOT_TAG" -R "$GITHUB_REPOSITORY"
