name: llama.rexx Installer QA

on:
  push:
    branches: [temp/llama-installer-qa]
  workflow_dispatch:
    inputs:
      source_run:
        description: Build run whose qualified core/plugin binaries are reused
        required: true
        type: string
        default: '35076278681'
      platform:
        description: Focused installer platform
        type: choice
        options: [windows, mac, all]
        default: windows
      cuda:
        description: Include retained Windows CUDA payload (no engine compilation)
        type: boolean
        default: false
      signed_mac:
        description: Use the retained signed/stapled Mac installers and verify offline installation
        type: boolean
        default: false
      repackage_signed_mac:
        description: Retry only Mac installer packaging from qualified signed ZIPs; permit that sole source Build failure
        type: boolean
        default: false
      signed_windows_release:
        description: Private draft QA release ID with signed artifacts from source_run (empty selects unsigned QA)
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  linux-filesystem:
    if: github.event_name == 'workflow_dispatch' && inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve retained core identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          retry=()
          if [[ "${{ inputs.repackage_signed_mac && inputs.signed_mac }}" == true ]]; then retry+=(--allow-mac-installer-retry); fi
          python3 scripts/resolve-installer-qa-source.py --run-id "$SOURCE_RUN" "${retry[@]}"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: user-test-${{ steps.source.outputs.commit }}-CREXX-linux-x64
          path: ${{ runner.temp }}/retained
      - name: Exercise installed standard filesystem library
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/retained/"*.zip -d "$RUNNER_TEMP/core"
          python3 scripts/test-installed-filesystem.py --prefix "$RUNNER_TEMP/core/CREXX-linux-x64" --logs "$RUNNER_TEMP/proof"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installed-rxfs-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/source-jobs.json
          retention-days: 14
  mac:
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'windows'
    name: Installer lifecycle ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            backend: metal
            os: macos-15
          - platform: macos-x86_64
            backend: cpu
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Resolve retained product identity
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || '35076278681' }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          retry=()
          if [[ "${{ inputs.repackage_signed_mac && inputs.signed_mac }}" == true ]]; then retry+=(--allow-mac-installer-retry); fi
          python3 scripts/resolve-installer-qa-source.py --run-id "$SOURCE_RUN" "${retry[@]}"
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35076278681' }}
          name: user-test-${{ steps.source.outputs.commit }}-CREXX-${{ matrix.platform }}
          path: ${{ runner.temp }}/retained/core
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35076278681' }}
          name: user-test-${{ steps.source.outputs.commit }}-llama.rexx-${{ matrix.platform }}-${{ matrix.backend }}
          path: ${{ runner.temp }}/retained/plugin
      - name: Unpack and run installer controls
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('core', 'scripts/package-core-release.py')
          core = importlib.util.module_from_spec(spec); spec.loader.exec_module(core)
          root = Path(os.environ['RUNNER_TEMP']) / 'retained'
          for kind in ('core', 'plugin'):
              archives = list((root / kind).glob('*.zip'))
              assert len(archives) == 1
              core.extract(archives[0], root / (kind + '-unpacked'))
          PY
          python3 -m unittest discover -s scripts/tests -p test_llama_installer.py -v > "$RUNNER_TEMP/proof/controls.log" 2>&1
      - name: Install core and plugin from real native packages
        if: '!inputs.signed_mac'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Disposable runner only: never point this lifecycle at a user's core.
          test "$GITHUB_ACTIONS" = true
          # Keep retained logs owned by the runner, not root.
          run_admin() { sudo "$@"; }
          if pkgutil --pkg-info org.crexx.crexx >/dev/null 2>&1; then exit 1; fi
          core="$RUNNER_TEMP/retained/core-unpacked/CREXX-$PLATFORM"
          plugin="$RUNNER_TEMP/retained/plugin-unpacked/CREXX-$PLATFORM"
          installed="$RUNNER_TEMP/cREXX installed with spaces"
          scripts/package-macos-pkg.sh --payload-dir "$core" --install-root "$installed" \
            --command-link-dir "$RUNNER_TEMP/command links" --no-background-image \
            --output "$RUNNER_TEMP/core-qa.pkg" > "$RUNNER_TEMP/proof/core-package.log" 2>&1
          python3 scripts/package-llama-installer.py --core "$core" --plugin "$plugin" \
            --unsigned-qa --output "$RUNNER_TEMP/llama-qa.pkg" > "$RUNNER_TEMP/proof/plugin-package.log" 2>&1
          run_admin installer -pkg "$RUNNER_TEMP/core-qa.pkg" -target / > "$RUNNER_TEMP/proof/core-install.log" 2>&1
          run_admin installer -pkg "$RUNNER_TEMP/llama-qa.pkg" -target / > "$RUNNER_TEMP/proof/plugin-install.log" 2>&1
          python3 scripts/test-llama-installed.py --prefix "$installed" --logs "$RUNNER_TEMP/proof/consumer"
          run_admin installer -pkg "$RUNNER_TEMP/llama-qa.pkg" -target / > "$RUNNER_TEMP/proof/plugin-reinstall.log" 2>&1
          run_admin sh "$installed/.llama-installer/manage.sh" remove "$installed" > "$RUNNER_TEMP/proof/remove.log" 2>&1
          test ! -e "$installed/bin/rxllama.rxplugin"
          mkdir -p "$RUNNER_TEMP/core consumer"
          cp "$installed/examples/hello.crexx" "$RUNNER_TEMP/core consumer/hello.crexx"
          "$installed/bin/crexx" "$RUNNER_TEMP/core consumer/hello.crexx" > "$RUNNER_TEMP/proof/core-after-remove.log" 2>&1
          grep -q 'hello CREXX world!' "$RUNNER_TEMP/proof/core-after-remove.log"
          echo 'Unsigned native installer lifecycle passed; signing/notarization/offline Gatekeeper are separate gates.' >> "$GITHUB_STEP_SUMMARY"
      - name: Download signed core installer
        if: inputs.signed_mac
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: CREXX-${{ matrix.platform }}-release-asset
          path: ${{ runner.temp }}/signed/core
      - name: Download signed plugin installer
        if: inputs.signed_mac && !inputs.repackage_signed_mac
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: llama.rexx-${{ matrix.platform }}-${{ matrix.backend }}-release-asset
          path: ${{ runner.temp }}/signed/plugin
      - name: Repackage and notarize retained signed Mac plugin
        if: inputs.signed_mac && inputs.repackage_signed_mac
        env:
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signed/plugin"
          bash scripts/repackage-macos-plugin.sh \
            "$RUNNER_TEMP/retained/core-unpacked/CREXX-${{ matrix.platform }}" \
            "$RUNNER_TEMP/retained/plugin-unpacked/CREXX-${{ matrix.platform }}" \
            "$RUNNER_TEMP/signed/plugin/llama.rexx-candidate-${{ steps.source.outputs.commit }}-${{ matrix.platform }}-${{ matrix.backend }}.pkg" \
            > "$RUNNER_TEMP/proof/repackage.log" 2>&1 || { tail -80 "$RUNNER_TEMP/proof/repackage.log"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: inputs.signed_mac && inputs.repackage_signed_mac
        with:
          name: signed-plugin-installer-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/signed/plugin/*.pkg
          if-no-files-found: error
          retention-days: 14
      - name: Verify signed installation with network interfaces disabled
        if: inputs.signed_mac
        shell: bash
        run: |
          set -euo pipefail
          core_pkgs=("$RUNNER_TEMP/signed/core/"*.pkg)
          plugin_pkgs=("$RUNNER_TEMP/signed/plugin/"*.pkg)
          test "${#core_pkgs[@]}" = 1 && test "${#plugin_pkgs[@]}" = 1
          sudo env GITHUB_ACTIONS=true "$(command -v python3)" scripts/test-macos-signed-installers.py \
            --core-pkg "${core_pkgs[0]}" --plugin-pkg "${plugin_pkgs[0]}" \
            --logs "$RUNNER_TEMP/proof/signed-offline"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-qa-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/source-jobs.json
          retention-days: 14

  windows:
    if: github.event_name == 'push' || inputs.platform != 'mac'
    runs-on: windows-latest
    timeout-minutes: 45
    # GitHub restricts draft-release visibility to callers with push access.
    # The job only reads the private staging release; it never publishes it.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Resolve retained product identity
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run || '35076278681' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SOURCE_RUN -notmatch '^\d+$') { throw 'Invalid source run' }
          $retry = @()
          if ('${{ inputs.repackage_signed_mac && inputs.signed_mac }}' -eq 'true') { $retry = @('--allow-mac-installer-retry') }
          python scripts/resolve-installer-qa-source.py --run-id $env:SOURCE_RUN @retry
          if ($LASTEXITCODE) { throw 'Unqualified source Build inputs' }
          $run = Get-Content "$env:RUNNER_TEMP/source.json" -Raw | ConvertFrom-Json
          git fetch --no-tags --depth=1 origin $run.head_sha
          if ($LASTEXITCODE) { throw 'Cannot fetch retained SDK headers' }
          New-Item -ItemType Directory "$env:RUNNER_TEMP/proof" | Out-Null
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35076278681' }}
          name: user-test-${{ steps.source.outputs.commit }}-CREXX-windows-x64
          path: ${{ runner.temp }}/retained/core
      - name: Compile only rxfs and native Rexx manager; run focused controls
        if: inputs.signed_windows_release == ''
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = @(Get-ChildItem "$env:RUNNER_TEMP/retained/core/*.zip")
          if ($zip.Count -ne 1) { throw 'Expected one core archive' }
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath "$env:RUNNER_TEMP/core"
          $core = "$env:RUNNER_TEMP/core/CREXX-windows-x64"
          python scripts/build-llama-manager.py --core $core --output "$env:RUNNER_TEMP/manager" *> "$env:RUNNER_TEMP/proof/manager-build.log"
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP/proof/manager-build.log" -Tail 60; throw 'Native manager build failed' }
          $env:LLAMA_MANAGER = "$env:RUNNER_TEMP/manager"
          python -m unittest discover -s scripts/tests -p test_llama_manager.py -v *> "$env:RUNNER_TEMP/proof/manager-tests.log"
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP/proof/manager-tests.log" -Tail 100; throw 'Manager controls failed' }
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35076278681' }}
          name: user-test-${{ steps.source.outputs.commit }}-llama.rexx-windows-x64-vulkan
          path: ${{ runner.temp }}/retained/vulkan
      - uses: actions/download-artifact@v8
        if: inputs.cuda == true
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35076278681' }}
          name: user-test-${{ steps.source.outputs.commit }}-llama.rexx-windows-x64-cuda
          path: ${{ runner.temp }}/retained/cuda
      - name: Native installers and installed provider lifecycle
        shell: pwsh
        env:
          INCLUDE_CUDA: ${{ inputs.cuda && '1' || '0' }}
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          SIGNED_QA_RELEASE: ${{ inputs.signed_windows_release }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = "${env:ProgramFiles(x86)}/NSIS/makensis.exe"
          if (!(Test-Path $nsis)) { choco install nsis --yes --no-progress }
          if (!(Test-Path $nsis)) { throw 'NSIS unavailable' }
          $signedArgs = @()
          if ($env:SIGNED_QA_RELEASE) {
            python scripts/fetch-signed-windows-qa.py --release-id $env:SIGNED_QA_RELEASE --commit $env:SOURCE_COMMIT --work "$env:RUNNER_TEMP"
            if ($LASTEXITCODE) { throw 'Signed candidate download/identity check failed' }
            $signedArgs = @('--signed-set', "$env:RUNNER_TEMP/signed/signed-delivery.json")
          }
          python scripts/test-llama-windows-installer.py --work "$env:RUNNER_TEMP" --makensis $nsis @signedArgs *> "$env:RUNNER_TEMP/proof/native-installer.log"
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP/proof/native-installer.log" -Tail 100; throw 'Native installer lifecycle failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-qa-windows-${{ github.sha }}
          path: |
            ${{ runner.temp }}/proof
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/source-jobs.json
            ${{ runner.temp }}/manager/manager.json
          retention-days: 14
